name: Release and Publish

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Which segment to bump: major, minor, or patch'
        required: true
        default: 'minor'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/music-assistant-skill

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Run regression tests
        run: |
          python -m pip install --requirement app/requirements.txt
          python -m unittest discover --start-directory tests --verbose

      - name: Set Git user
        env:
          ACTOR: ${{ github.actor }}
        run: |
          git config user.name "${ACTOR}"
          git config user.email "${ACTOR}@users.noreply.github.com"

      - name: Read and bump VERSION
        id: bump
        shell: bash
        env:
          BUMP_INPUT: ${{ inputs.bump }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          bump="${BUMP_INPUT}"
          if [ -z "${bump}" ]; then bump="patch"; fi
          if [ ! -f VERSION ]; then echo "0.0.1-beta" > VERSION; fi

          current="$(cat VERSION)"
          core="${current%%-*}"
          prerelease=""
          if [[ "$current" == *"-"* ]]; then prerelease="-${current#*-}"; fi

          IFS='.' read -r major minor patch <<< "$core"
          case "$bump" in
            major)
              major=$((major + 1)); minor=0; patch=0 ;;
            minor)
              minor=$((minor + 1)); patch=0 ;;
            patch|*)
              patch=$((patch + 1)) ;;
          esac

          new="$major.$minor.$patch$prerelease"
          echo "$new" > VERSION

          git add VERSION
          git commit -m "chore(release): bump version to $new [skip ci]" || echo "no changes to commit"
          git tag "v$new" || echo "tag exists"
          git push origin "HEAD:${TARGET_BRANCH}" --follow-tags || git push --follow-tags origin

          echo "version=$new" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          tag_name: v${{ steps.bump.outputs.version }}
          name: Release v${{ steps.bump.outputs.version }}
          draft: false
          prerelease: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.bump.outputs.version }}
            type=raw,value=latest

      - name: Build & Push (multi-arch)
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
