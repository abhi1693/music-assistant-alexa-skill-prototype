---
name: Release and Publish

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which segment to bump
        required: true
        default: minor
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: music-assistant-skill-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Test and create release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Run regression tests
        run: |
          python -m pip install --requirement app/requirements.txt
          python -m unittest discover --start-directory tests --verbose

      - name: Set Git user
        env:
          ACTOR: ${{ github.actor }}
        run: |
          git config user.name "${ACTOR}"
          git config user.email "${ACTOR}@users.noreply.github.com"

      - name: Read and bump VERSION
        id: bump
        shell: bash
        env:
          BUMP_INPUT: ${{ inputs.bump }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          current="$(tr -d '[:space:]' < VERSION)"
          core="${current%%-*}"
          prerelease=""
          if [[ "$current" == *"-"* ]]; then
            prerelease="-${current#*-}"
          fi

          IFS='.' read -r major minor patch <<< "$core"
          case "$BUMP_INPUT" in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
          esac

          new="$major.$minor.$patch$prerelease"
          echo "$new" > VERSION
          python scripts/sync_version.py

          git add VERSION addons/music-assistant-skill/config.json
          git commit -m "chore(release): bump version to $new [skip ci]"
          git tag "v$new"
          git push origin "HEAD:${TARGET_BRANCH}" --follow-tags
          echo "version=$new" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          tag_name: v${{ steps.bump.outputs.version }}
          name: Release v${{ steps.bump.outputs.version }}
          draft: false
          prerelease: true

  build:
    name: Multi-architecture image
    needs:
      - release
    permissions:
      contents: read
      packages: write
    uses: abhi1693/actions/.github/workflows/docker-build-push.yml@3f57777054410f3f0e59b58ba7e16dc51288c5fd
    with:
      runs-on: ubuntu-24.04-arm
      image: ghcr.io/abhi1693/music-assistant-skill
      context: .
      file: Dockerfile
      platforms: linux/amd64,linux/arm64
      qemu: true
      cache-scope: music-assistant-skill
      tags: |
        type=raw,value=${{ needs.release.outputs.version }}
        type=raw,value=latest
      labels: |
        org.opencontainers.image.source=https://github.com/abhi1693/music-assistant-alexa-skill-prototype
        org.opencontainers.image.title=Music Assistant Alexa Skill
        org.opencontainers.image.version=${{ needs.release.outputs.version }}
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
