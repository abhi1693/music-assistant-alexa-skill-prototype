---
name: Build and Push Docker image to GHCR

on:
  push:
    branches:
      - master
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/docker-ghcr.yml
      - app/**
      - assets/icons/**
      - scripts/ask_create_skill.sh
      - scripts/build_skill_manifest.py
      - scripts/find_skills_to_delete.py
      - tests/**
      - VERSION
  pull_request:
    branches:
      - master
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/docker-ghcr.yml
      - app/**
      - assets/icons/**
      - scripts/ask_create_skill.sh
      - scripts/build_skill_manifest.py
      - scripts/find_skills_to_delete.py
      - tests/**
      - VERSION
  workflow_dispatch:

concurrency:
  group: music-assistant-skill-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Python regression tests
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Run regression tests
        run: |
          python -m pip install --requirement app/requirements.txt
          python -m unittest discover --start-directory tests --verbose

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          value="$(tr -d '[:space:]' < VERSION)"
          test -n "$value"
          echo "value=$value" >> "$GITHUB_OUTPUT"

  build:
    name: Multi-architecture image
    needs:
      - test
    permissions:
      contents: read
      packages: write
    uses: abhi1693/actions/.github/workflows/docker-build-push.yml@3f57777054410f3f0e59b58ba7e16dc51288c5fd
    with:
      runs-on: ubuntu-24.04-arm
      image: ghcr.io/abhi1693/music-assistant-skill
      context: .
      file: Dockerfile
      platforms: linux/amd64,linux/arm64
      qemu: true
      cache-scope: music-assistant-skill
      push: ${{ github.event_name != 'pull_request' }}
      tags: |
        type=raw,value=${{ needs.test.outputs.version }}
        type=raw,value=latest
      labels: |
        org.opencontainers.image.source=https://github.com/abhi1693/music-assistant-alexa-skill-prototype
        org.opencontainers.image.title=Music Assistant Alexa Skill
        org.opencontainers.image.version=${{ needs.test.outputs.version }}
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
